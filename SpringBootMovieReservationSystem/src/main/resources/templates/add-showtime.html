<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Showtime</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #191919;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 80px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-card {
            background-color: #252525;
            border-radius: 10px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffc2c2;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            border: none;
            border-radius: 5px;

            background-color: #333333;
            color: white;

            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #5d2236;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .cancel-button {
            flex: 1;

            padding: 12px;

            border: none;
            border-radius: 5px;

            background-color: #5d2236;
            color: white;

            font-size: 15px;
            text-align: center;
            text-decoration: none;

            cursor: pointer;
        }

        button:hover,
        .cancel-button:hover {
            background-color: #7a2d48;
        }

        select {
        width: 100%;
        box-sizing: border-box;

        padding: 12px;

        border: none;
        border-radius: 5px;

        background-color: #333333;
        color: white;

        font-size: 16px;
        }

        select:focus {
            outline: 2px solid #5d2236;
        }
        .error {
            text-align: center;
            color: #ffc2c2;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Add Showtime</h1>

        <div class="form-card">

            <form th:action="@{/admin/showtimes/add}"
                  th:object="${showtime}"
                  method="post">

                <div class="form-group">

                    <label for="hall">Hall:</label>

                    <select id="hall" name="hallId" required>
                        <option value="" disabled selected>
                            Select a hall
                        </option>

                        <option th:each="hall : ${halls}"
                                th:value="${hall.id}"
                                th:text="'Hall ' + ${hall.id} + ' - ' + ${hall.numberOfSeats} + ' seats'">
                        </option>
                    </select>

                    <label for="startTime">
                        Movie start time:
                    </label>

                    <input
                        type="time"
                        id="startTime"
                        th:field="*{startTime}"
                        placeholder="Enter movie start time"
                        required>

                    <label for="movie">Movie:</label>

                    <select id="movie" name="movieId" required>
                        <option value="" disabled selected>
                            Select a movie
                        </option>

                        <option th:each="movie : ${movies}"
                                th:value="${movie.id}"
                                th:text="${movie.movieName}">
                        </option>
                    </select>

                </div>


                <div class="buttons">

                    <button type="submit">
                        Add Showtime
                    </button>

                    <a th:href="@{/admin/showtimes}"
                       class="cancel-button">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>
    <div th:if="${param.error}" class="error">
        A showtime already exists at this time in the selected hall.
    </div>
</body>

</html>
