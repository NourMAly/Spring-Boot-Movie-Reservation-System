<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Hall</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #191919;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 80px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-card {
            background-color: #252525;
            border-radius: 10px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffc2c2;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            border: none;
            border-radius: 5px;

            background-color: #333333;
            color: white;

            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #5d2236;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .cancel-button {
            flex: 1;

            padding: 12px;

            border: none;
            border-radius: 5px;

            background-color: #5d2236;
            color: white;

            font-size: 15px;
            text-align: center;
            text-decoration: none;

            cursor: pointer;
        }

        button:hover,
        .cancel-button:hover {
            background-color: #7a2d48;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Add Hall</h1>

        <div class="form-card">

            <form th:action="@{/admin/halls/add}"
                  th:object="${hall}"
                  method="post">

                <div class="form-group">

                    <label for="numberOfSeats">
                        Number of Seats
                    </label>

                    <input
                        type="number"
                        id="numberOfSeats"
                        th:field="*{numberOfSeats}"
                        min="1"
                        placeholder="Enter number of seats"
                        required>

                </div>


                <div class="buttons">

                    <button type="submit">
                        Add Hall
                    </button>

                    <a th:href="@{/admin/halls}"
                       class="cancel-button">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
