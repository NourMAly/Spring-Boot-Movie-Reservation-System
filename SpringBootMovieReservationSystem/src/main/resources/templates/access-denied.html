<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Access Denied Page</title>
    <style>
        .home-button {
            display: inline-block;
            padding: 10px 18px;

            background-color: #333333;
            color: white;

            text-decoration: none;
            border-radius: 6px;
        }

        .home-button:hover {
            background-color: #444444;
        }
    </style>
</head>

<body>
    <h3>Access Denied - You are not authorized to access this resource.</h3>
    <hr>
    <div th:if="${#authorization.expression('hasRole(''EMPLOYEE'')')}">
        <a th:href="@{/admin}" class="home-button">
            Back to Home
        </a>
    </div>

    <div th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}">
        <a th:href="@{/customer/home}" class="home-button">
            Back to Home
        </a>
    </div>
</body>

</html>
