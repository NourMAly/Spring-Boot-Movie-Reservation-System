spring.application.name=SpringBootMovieReservationSystem


spring.datasource.url=jdbc:mysql://localhost:3306/movie_db_spring_boot
spring.datasource.username=springstudent
spring.datasource.password=springstudent

# Turn off spring boot banner
spring.main.banner-mode=off

# Reduce logging level. Set logging level to warn
logging.level.root=warn

# Add  logging configs to display SQl stats
logging.level.org.hibernate.SQL=debug
# To see values assigned to SQL stats
logging.level.org.hibernate.orm.jdbc.bind=trace 

#configure Jackson to fail when it encounters a property that doesn't exist in DTO
spring.jackson.deserialization.fail-on-unknown-properties=true

app.jwt.secret:${JWT_SECRET}
access.ttl.minutes:15
refresh.ttl.days: 7

#true in prod w/ https
cookie.secure:false

spring.jpa.properties.hibernate.jdbc.time_zone: UTC

spring.jpa.open-in-view: false

app.cors.allowed-origins: http://localhost:5173