<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customer Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #191919;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 350px;
            background-color: #252525;
            border: 1px solid #333333;
            border-radius: 8px;

            padding: 35px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;

            background-color: #191919;
            color: white;

            border: 1px solid #333333;
            border-radius: 5px;
        }

        input:focus {
            outline: none;
            border-color: #555555;
        }

        .login-button {
            width: 100%;
            padding: 12px;

            background-color: #5d2236;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;
            font-size: 16px;
        }

        .login-button:hover {
            background-color: #7a2d48;
        }

        .admin-link {
            margin-top: 25px;
            padding-top: 20px;

            border-top: 1px solid #333333;
        }

        .admin-link p {
            color: #aaaaaa;
            margin-bottom: 10px;
        }

        .admin-link a {
            color: white;
            text-decoration: none;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        .error {
            color: #ff7777;
            margin-bottom: 15px;
        }

        .logout-message {
            color: #6af458;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Customer Login</h1>

        <div th:if="${param.error}" class="error">
            Invalid username or password.
        </div>

        <div th:if="${param.logout}" class="logout-message">
            You have been logged out.
        </div>

        <form th:action="@{/authenticateTheUser}" method="POST">

            <div class="form-group">
                <label for="username">Username</label>

                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <div class="admin-link">

            <p>Are you an employee?</p>

            <a th:href="@{/showAdminLoginPage}">
                Admin Login
            </a>

        </div>

    </div>

</body>

</html>
