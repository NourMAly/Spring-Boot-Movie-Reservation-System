<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Movies</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #191919;
            color: white;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        .search-form {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto 30px;
            display: flex;
            gap: 10px;
        }

        .search-form input {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        .search-form button {
            padding: 12px 20px;
            background-color: #5d2236;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .movies-container {
            width: 90%;
            max-width: 1100px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .movie-card {
            background-color: #252525;
            border-radius: 10px;
            overflow: hidden;
            padding-bottom: 20px;
        }

        .movie-card img {
            width: 100%;
            height: 375px;
            object-fit: contain;
            display: block;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h2 {
            margin-top: 0;
        }

        .movie-info p {
            color: #cccccc;
        }

        .runtime {
            color: #ffc2c2;
        }

        .book-button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;

            background-color: #5d2236;
            color: white;
            text-decoration: none;

            border-radius: 5px;
        }

        .book-button:hover {
            background-color: #7a2d48;
        }

        .admin-banner {
            width: 100%;
            height: 60px;
            background-color: #5d2236;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            border-bottom: 1px solid #333333;
            justify-content: center;
        }

        .admin-home {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 6px;
            transition: background-color 0.2s;
            font-family: Arial, sans-serif;
            background-color: transparent;
            border: none;
        }

        .admin-home:hover {
            background-color: #7a2d48;
        }
    </style>
</head>

<body>

    <div th:fragment="adminNav" class="admin-banner">
        <a th:href="@{/customer/home}" class="admin-home">Home </a>
        <a th:href="@{/customer/movies}" class="admin-home">Movies</a>
        <a th:href="@{/customer/reservations/list}" class="admin-home">My Reservations</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="admin-home">
                Logout
            </button>
        </form>
    </div>
    <h1>Movies</h1>

    <form th:action="@{/customer/movies/search}" method="get" class="search-form">
        <input type="text" name="name" placeholder="Enter movie name" required>

        <button type="submit">Search</button>
    </form>
    <!-- Error message -->

    <p th:if="${error}" th:text="${error}" style="text-align: center; color: #ffc2c2;"> </p>
    <div class="movies-container">

        <div class="movie-card" th:each="movie : ${movies}">

            <img th:src="@{/images/{poster}(poster=${movie.posterURL})}" th:alt="${movie.movieName}">

            <div class="movie-info">

                <h2 th:text="${movie.movieName}">
                    Movie Name
                </h2>

                <p th:text="${movie.genre}">
                    Genre
                </p>

                <p th:text="${movie.description}">
                    Description
                </p>

                <p class="runtime">
                    Runtime:
                    <span th:text="${movie.runTimeInMinutes}">
                        120
                    </span>
                    minutes
                </p>

                <a class="book-button" th:href="@{/customer/movies/{id}(id=${movie.id})}">
                    View Showtimes
                </a>

            </div>

        </div>

    </div>

</body>

</html>
